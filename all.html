      }

      /* ナビゲーション */
      nav {
        background: #333;
        color: #fff;
        padding: 10px;
      }
      nav a {
        color: #fff;
        margin: 0 10px;
        text-decoration: none;
        font-size: 16px;
      }

      /* グリッド一覧 */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
        padding: 20px;
      }

      .item img {
        width: 100px;
        height: 110px;
        object-fit: contain;
      }

      .char {
        font-size: 20px;
        margin-top: 5px;
      }
    </style>
