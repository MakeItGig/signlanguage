      body {

        background: #333;

      nav a {
        color: #fff;
        margin: 0 10px;

        font-size: 16px;
      }

      /* コンテンツ */
      .container {
        padding: 20px;
      }

      .item {
        margin-bottom: 25px;
      }

      .item img {
        width: 170px;
        height: 180px;
        object-fit: contain;
      }

      .char {
        font-size: 26px;
        margin-top: 10px;
        font-weight: bold;
      }

      .desc {
        font-size: 16px;
        margin-top: 5px;

    <h2>た行（た・ち・つ・て・と）</h2>

    <div class="container">
      <div class="item">
        <img src="images/ta.png" alt="た" />
        <div class="char">た</div>
        <div class="desc">
          「た」の指文字
          いわゆる「いいね!」ジェスチャーのように親指だけを立てて表現します。
        </div>
      </div>

      <div class="item">
        <img src="images/ti.png" alt="ち" />
        <div class="char">ち</div>
        <div class="desc">
          「ち」の指文字 小指だけ立てて他の4本指は輪を描くようにくっつけます。
        </div>
      </div>

      <div class="item">
        <img src="images/tu.png" alt="つ" />
        <div class="char">つ</div>
        <div class="desc">
          「つ」の指文字
          小指と薬指を立て、残り3本指は輪を描くようにくっつけます。
        </div>
      </div>

      <div class="item">
        <img src="images/te.png" alt="て" />
        <div class="char">て</div>
        <div class="desc">
          「て」の指文字 「やあ!」と挨拶する感じで相手に手のひらを向けます。
        </div>
      </div>

      <div class="item">
        <img src="images/to.png" alt="と" />
        <div class="char">と</div>
        <div class="desc">
          「と」の指文字
          手の甲を相手側に向けて軽く握り、人差し指と中指を立てます。
        </div>
      </div>
    </div>
  </body>
</html>
