<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>単語・表現（あ）</title>

    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      nav {
        background: #333;
        color: #fff;
        padding: 10px;
      }
      nav a {
        color: #fff;
        margin: 0 10px;
        text-decoration: none;
        font-size: 16px;
      }

      .container {
        padding: 20px;
      }

      .item {
        margin-bottom: 25px;
      }

      .item img {
        width: 170px;
        height: 180px;
        object-fit: contain;
      }

      .word {
        font-size: 22px;
        margin-top: 10px;
        font-weight: bold;
      }

      .desc {
        font-size: 16px;
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <nav>
      <a href="../index.html">トップ</a>
      <a href="../all.html">一覧</a>
      <a href="../a.html">あ行</a>
      <a href="../ka.html">か行</a>
      <a href="../words/">単語カテゴリ</a>
    </nav>

    <h2>単語・表現（あ）</h2>

    <div class="container">
      <div class="item">
        <img src="../images/hello.png" alt="あいさつ" />
        <div class="word">あいさつ</div>
        <div class="desc">ここに説明テキストが入ります。</div>
      </div>

      <div class="item">
        <img src="../images/thanks.png" alt="ありがとう" />
        <div class="word">ありがとう</div>
        <div class="desc">ここに説明テキストが入ります。</div>
      </div>

      <!-- 必要な単語をここに追加 -->
    </div>
  </body>
</html>
