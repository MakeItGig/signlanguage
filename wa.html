    <h2>わ行（わ・を・ん）</h2>

    <div class="container">
      <div class="item">
        <img src="images/wa.png" alt="わ" />
        <div class="char">わ</div>
        <div class="desc">
         「わ」の指文字
          人差し指、中指、薬指の3本を立てます。これはアルファベットの｢W｣の指文字と同じです。

        </div>
      </div>

      <div class="item">
        <img src="images/wo.png" alt="を" />
        <div class="char">を</div>
        <div class="desc">
         「を」の指文字
         「お」の指文字の形と同じで、自分側に引く動きをします。
        </div>
      </div>

      <div class="item">
        <img src="images/n.png" alt="ん" />
        <div class="char">ん</div>
        <div class="desc">
         「ん」の指文字
          人差し指だけを立てて、カタカナの「ン」の字を書く動きをします。

        </div>
      </div>

  </body>
