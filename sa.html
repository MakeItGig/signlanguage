    <h2>さ行（さ・し・す・せ・そ）</h2>

    <div class="container">
      <div class="item">
        <img src="images/sa.png" alt="さ" />
        <div class="char">さ</div>
        <div class="desc">
          ジャンケンの「グー」の形 これはアルファベットの｢S｣と同じ
        </div>
      </div>

      <div class="item">
        <img src="images/si.png" alt="し" />
        <div class="char">し</div>
        <div class="desc">
          手の甲を相手側に向けて親指、人差し指、中指の3本を伸ばす
          これは数字の「7」の指文字と同じ
        </div>
      </div>

      <div class="item">
        <img src="images/su.png" alt="す" />
        <div class="char">す</div>
        <div class="desc">
          「し」の指文字をそのまま下に向けます カタカナの「ス」の形が由来
        </div>
      </div>

      <div class="item">
        <img src="images/se.png" alt="せ" />
        <div class="char">せ</div>
        <div class="desc">
          ジャンケンのグーの形で中指だけ伸ばし、中指の腹を相手に向けます。
          5本指の中で一番「”背”が高い」が由来
        </div>
      </div>

      <div class="item">
        <img src="images/so.png" alt="そ" />
        <div class="char">そ</div>
        <div class="desc">
          「それ！」と指さすように人差し指を伸ばし、斜め下に向けます。
          「それ」と表現する時と同じ形で、由来もこの「それ」の「そ」です
        </div>
      </div>
    </div>
  </body>
